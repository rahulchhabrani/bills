<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bills</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg:  #000000;
    --bg2: #1C1C1E;
    --bg3: #2C2C2E;
    --bg4: #3A3A3C;
    --blue:   #0A84FF;
    --green:  #30D158;
    --red:    #FF453A;
    --indigo: #5E5CE6;
    --purple: #BF5AF2;
    --teal:   #5AC8FA;
    --orange: #FF9F0A;
    --label:  rgba(255,255,255,1);
    --label2: rgba(235,235,245,0.60);
    --label3: rgba(235,235,245,0.30);
    --label4: rgba(235,235,245,0.16);
    --sep:    rgba(84,84,88,0.65);
    --sep-o:  #38383A;
    --radius: 12px;
  }

  body {
    background: var(--bg);
    color: var(--label);
    font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 48px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .app { width: 100%; max-width: 430px; }

  .navbar {
    position: sticky; top: 0; z-index: 100;
    padding: 14px 20px 10px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(28,28,30,0.85);
    backdrop-filter: blur(24px) saturate(200%);
    -webkit-backdrop-filter: blur(24px) saturate(200%);
    border-bottom: 0.33px solid var(--sep);
  }
  .navbar-month { font-size: 13px; color: var(--label2); font-weight: 400; }
  .navbar-title { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
  .navbar-placeholder { width: 60px; }

  .hero { padding: 22px 20px 4px; }
  .hero-title { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; color: var(--label); line-height: 1.1; }
  .hero-sub { font-size: 15px; color: var(--label2); margin-top: 5px; font-weight: 400; }

  .section { margin-top: 28px; padding: 0 16px; }
  .section-label {
    font-size: 13px; font-weight: 600; letter-spacing: 0.6px;
    text-transform: uppercase; color: var(--label2);
    margin-bottom: 8px; padding: 0 4px;
  }

  .summary-card {
    background: var(--bg2); border-radius: 16px; padding: 18px 18px 16px;
    position: relative; overflow: hidden;
  }
  .summary-card::after {
    content: ''; position: absolute; top: -40px; right: -40px;
    width: 130px; height: 130px; border-radius: 50%;
    background: radial-gradient(circle, rgba(48,209,88,0.14), transparent 70%);
    pointer-events: none;
  }
  .summary-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
  .summary-nums { line-height: 1; }
  .summary-big { font-size: 36px; font-weight: 700; letter-spacing: -1px; color: var(--label); }
  .summary-big .n-green { color: var(--green); }
  .summary-desc { font-size: 13px; color: var(--label2); margin-top: 4px; }
  .summary-badge {
    width: 44px; height: 44px; background: rgba(48,209,88,0.15);
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .prog-track { height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
  .prog-fill {
    height: 100%; background: var(--green); border-radius: 3px;
    transition: width 0.55s cubic-bezier(0.25,0.46,0.45,0.94); width: 0%;
  }
  .all-done {
    display: none; text-align: center; margin-top: 10px;
    font-size: 13px; color: var(--green); font-weight: 500;
    animation: fadeUp 0.3s ease;
  }

  .list-wrap { background: var(--bg2); border-radius: var(--radius); overflow: hidden; }

  .cc-row {
    display: flex; align-items: center; gap: 13px;
    padding: 11px 14px; cursor: pointer; user-select: none;
    position: relative; min-height: 62px;
    transition: background 0.12s;
  }
  .cc-row:active { background: rgba(255,255,255,0.07); }
  .cc-row + .cc-row::before {
    content: ''; position: absolute;
    top: 0; left: 65px; right: 0;
    height: 0.33px; background: var(--sep);
  }

  .cc-logo {
    width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; letter-spacing: -0.3px;
    overflow: hidden; position: relative;
  }
  .cc-logo.has-logo { background: #fff; }
  .cc-logo.no-logo  { background: linear-gradient(135deg, var(--indigo), var(--blue)); color: #fff; }
  .cc-logo img { width: 88%; height: 88%; object-fit: contain; display: block; }

  .cc-info { flex: 1; min-width: 0; }
  .cc-name {
    font-size: 16px; font-weight: 500; letter-spacing: -0.2px;
    color: var(--label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cc-sub { font-size: 13px; color: var(--label2); margin-top: 1px; transition: color 0.2s; }
  .cc-row.paid .cc-sub { color: var(--green); }

  .cc-check {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid var(--sep-o);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: transparent;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .cc-check::after { content: '✓'; }
  .cc-row.paid .cc-check { background: var(--green); border-color: var(--green); color: #fff; }

  .cc-del {
    width: 30px; height: 30px; border-radius: 8px; border: none;
    background: none; color: var(--label3); cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; opacity: 0;
    transition: opacity 0.15s, background 0.15s, color 0.15s;
  }
  .cc-row:hover .cc-del { opacity: 1; }
  .cc-del:hover { background: rgba(255,69,58,0.15); color: var(--red); }

  .empty { padding: 36px 16px; text-align: center; color: var(--label2); font-size: 15px; }
  .empty-icon { font-size: 36px; opacity: 0.45; margin-bottom: 10px; }

  .add-wrap {
    background: var(--bg2); border-radius: var(--radius); overflow: hidden;
    display: flex; align-items: center; padding: 0 14px; gap: 12px; height: 52px;
  }
  .add-plus {
    width: 30px; height: 30px; background: var(--blue); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 300; color: #fff; flex-shrink: 0;
    line-height: 1; user-select: none;
  }
  .add-input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--label); font-size: 16px; font-family: inherit;
    caret-color: var(--blue); padding: 0;
  }
  .add-input::placeholder { color: var(--label3); }
  .add-go {
    background: none; border: none; color: var(--blue); cursor: pointer;
    font-size: 15px; font-weight: 600; font-family: inherit; flex-shrink: 0;
    opacity: 0; transition: opacity 0.15s; padding: 0;
  }
  .add-input:not(:placeholder-shown) + .add-go { opacity: 1; }

  .footer-note {
    text-align: center; font-size: 12px; color: var(--label3);
    padding: 16px 24px 0; line-height: 1.6;
  }
  .footer-note strong { color: var(--label2); font-weight: 500; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @keyframes rowIn  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .cc-row { animation: rowIn 0.22s ease; }
  #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div class="app">
  <div class="navbar">
    <span class="navbar-month" id="nav-month"></span>
    <span class="navbar-title">Bills</span>
    <span class="navbar-placeholder"></span>
  </div>
  <div class="hero">
    <div class="hero-title">Credit Cards</div>
    <div class="hero-sub">Tap any card to mark it paid</div>
  </div>
  <div class="section">
    <div class="section-label">Overview</div>
    <div class="summary-card">
      <div class="summary-top">
        <div class="summary-nums">
          <div class="summary-big">
            <span class="n-green" id="paid-count">0</span>
            <span style="color:var(--label3);font-size:28px;font-weight:400"> / </span>
            <span id="total-count">0</span>
          </div>
          <div class="summary-desc">bills paid this month</div>
        </div>
        <div class="summary-badge">&#128179;</div>
      </div>
      <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
      <div class="all-done" id="all-done">&#127881;&nbsp; All done for this month!</div>
    </div>
  </div>
  <div class="section">
    <div class="section-label">Cards</div>
    <div id="card-list"></div>
  </div>
  <div class="section">
    <div class="section-label">Add Card</div>
    <div class="add-wrap">
      <div class="add-plus">+</div>
      <input class="add-input" id="add-input" type="text" placeholder="e.g. HDFC Regalia, ICICI Amazon" maxlength="60">
      <button class="add-go" id="add-btn">Add</button>
    </div>
  </div>
  <div class="footer-note">
    Paid status <strong>resets automatically</strong> on the 1st of every month. Your cards are always saved.
  </div>
</div>
<script>
const KEY = 'cc_tracker_v3';
function monthKey() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1); }
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return { cards: [], paid: {}, month: monthKey() };
    const d = JSON.parse(raw);
    if (d.month !== monthKey()) { d.paid = {}; d.month = monthKey(); save(d); }
    return d;
  } catch(e) { return { cards: [], paid: {}, month: monthKey() }; }
}
function save(d) { localStorage.setItem(KEY, JSON.stringify(d)); }
let data = load();

/* ---- BANK MAP: always maps to the ISSUING BANK domain, never the brand ---- */
const BANK_MAP = [
  /* Co-branded: keyword order matters - more specific first */
  { kw: ['amazon pay icici','amazon pay'],       domain: 'icicibank.com' },
  { kw: ['makemytrip icici','makemytrip'],       domain: 'icicibank.com' },
  { kw: ['coral icici','coral rupay icici'],     domain: 'icicibank.com' },
  { kw: ['kiwi yes bank','kiwi'],                domain: 'yesbank.in' },
  { kw: ['scapia federal','scapia'],             domain: 'federalbank.co.in' },
  { kw: ['stable money suryoday','stablemoney','stable money'], domain: 'suryodaybank.com' },
  { kw: ['flipkart axis','flipkart'],            domain: 'axisbank.com' },
  { kw: ['swiggy hdfc','swiggy'],               domain: 'hdfcbank.com' },
  { kw: ['zomato hdfc','zomato'],               domain: 'hdfcbank.com' },
  { kw: ['tata neu hdfc','tata neu'],           domain: 'hdfcbank.com' },
  { kw: ['tata neu sbi'],                       domain: 'sbicard.com' },
  { kw: ['airtel axis','airtel'],               domain: 'axisbank.com' },
  { kw: ['ola money sbi','ola'],                domain: 'sbicard.com' },
  /* Standalone banks */
  { kw: ['sbi','state bank of india'],           domain: 'sbicard.com' },
  { kw: ['icici'],                               domain: 'icicibank.com' },
  { kw: ['hdfc'],                                domain: 'hdfcbank.com' },
  { kw: ['axis'],                                domain: 'axisbank.com' },
  { kw: ['kotak'],                               domain: 'kotak.com' },
  { kw: ['yes bank','yesbank'],                  domain: 'yesbank.in' },
  { kw: ['idfc first','idfc'],                   domain: 'idfcfirstbank.com' },
  { kw: ['indusind'],                            domain: 'indusind.com' },
  { kw: ['amex','american express'],             domain: 'americanexpress.com' },
  { kw: ['federal bank','federal'],              domain: 'federalbank.co.in' },
  { kw: ['bobcard','bank of baroda','bob'],      domain: 'bankofbaroda.in' },
  { kw: ['suryoday'],                            domain: 'suryodaybank.com' },
  { kw: ['rbl'],                                 domain: 'rblbank.com' },
  { kw: ['au small','au bank','aubank'],         domain: 'aubank.in' },
  { kw: ['standard chartered','stanchart'],      domain: 'sc.com' },
  { kw: ['pnb','punjab national'],               domain: 'pnbindia.in' },
  { kw: ['canara'],                              domain: 'canarabank.com' },
  { kw: ['union bank'],                          domain: 'unionbankofindia.co.in' },
  { kw: ['citi','citibank'],                     domain: 'citibank.com' },
  { kw: ['hsbc'],                                domain: 'hsbc.com' },
  { kw: ['bank of india'],                       domain: 'bankofindia.co.in' },
  { kw: ['onecard','one card'],                  domain: 'getonecard.app' },
  { kw: ['slice'],                               domain: 'sliceit.com' },
  { kw: ['bajaj','bajaj finserv'],               domain: 'bajajfinserv.in' },
  { kw: ['paytm'],                               domain: 'paytmbank.com' },
];

const STOP = new Set(['gold','silver','platinum','titanium','regalia','infinia','sapphire','emerald','credit','card','debit','signature','classic','elite','prime','select','visa','mastercard','rupay','amex','diners','club','pro','lite','plus','super','ultra','premier','prestige','infinite','world','privilege','cashback','rewards','miles','travel','fuel','shopping','life','style','ace','pulse','duo','edge','flex','freedom','velocity','bonus','pay','neu','coral','millennia','moneyback','digiplus','digital','simply','click','save','biz','business','corporate','tiger','rewards']);

function bankDomain(name) {
  const low = name.toLowerCase();
  for (const b of BANK_MAP) { if (b.domain && b.kw.some(k => low.includes(k))) return b.domain; }
  return null;
}
function inferDomain(name) {
  const words = name.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/s+/).filter(w => w.length > 1 && !STOP.has(w));
  return words.length ? words[0] + 'bank.com' : null;
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function initials(name) {
  const words = name.trim().split(/s+/).filter(w => !STOP.has(w.toLowerCase()));
  return words.length >= 2 ? (words[0][0] + words[1][0]).toUpperCase() : name.trim().substring(0,2).toUpperCase();
}

/* ---- LOGO LOADING with globe-detection fix ----
   Google favicon returns a 16x16 globe placeholder (HTTP 200) for unknown domains.
   onerror never fires. We detect it via naturalWidth < 32 in onload and skip to initials. */
function makeLogo(cardName) {
  const domain = bankDomain(cardName) || inferDomain(cardName);
  const inits = esc(initials(cardName));
  if (!domain) return '<div class="cc-logo no-logo">' + inits + '</div>';
  const primary = esc('https://logo.clearbit.com/' + domain);
  const fallback = esc('https://www.google.com/s2/favicons?domain=' + domain + '&sz=128');
  return '<div class="cc-logo has-logo"><img src="' + primary + '" ' +
    'data-fb="' + fallback + '" data-inits="' + inits + '" ' +
    'onerror="logoErr(this)" onload="logoLoad(this)" alt="' + inits + '" loading="lazy"></div>';
}

function logoLoad(img) {
  /* Google favicon returns 16x16 globe for unknown domains — skip it */
  if (img.naturalWidth < 32 && img.getAttribute('data-tried')) {
    showInits(img);
  }
}
function logoErr(img) {
  const fb = img.getAttribute('data-fb');
  const tried = img.getAttribute('data-tried') || '';
  if (fb && tried !== fb) {
    img.setAttribute('data-tried', fb);
    img.src = fb;
  } else {
    showInits(img);
  }
}
function showInits(img) {
  const w = img.parentElement;
  if (w) { w.className = 'cc-logo no-logo'; w.textContent = img.getAttribute('data-inits'); }
}
window.logoErr = logoErr;
window.logoLoad = logoLoad;

function render() {
  const list = document.getElementById('card-list');
  list.innerHTML = '';
  if (!data.cards.length) {
    list.innerHTML = '<div class="list-wrap"><div class="empty"><div class="empty-icon">&#128179;</div>No cards yet &mdash; add one below</div></div>';
    return updateProgress();
  }
  const wrap = document.createElement('div'); wrap.className = 'list-wrap';
  data.cards.forEach(function(card) {
    const paid = !!data.paid[card.id];
    const row = document.createElement('div');
    row.className = 'cc-row' + (paid ? ' paid' : ''); row.dataset.id = card.id;
    row.innerHTML = makeLogo(card.name) +
      '<div class="cc-info"><div class="cc-name">' + esc(card.name) + '</div><div class="cc-sub">' + (paid ? '&#10003;&nbsp;Paid' : 'Pending') + '</div></div>' +
      '<div class="cc-check"></div>' +
      '<button class="cc-del" data-id="' + card.id + '" title="Remove">&#10005;</button>';
    row.addEventListener('click', function(e) { if (!e.target.closest('.cc-del')) toggle(card.id); });
    row.querySelector('.cc-del').addEventListener('click', function(e) { e.stopPropagation(); remove(card.id); });
    wrap.appendChild(row);
  });
  list.appendChild(wrap); updateProgress();
}
function updateProgress() {
  const total = data.cards.length, paid = data.cards.filter(function(c){return data.paid[c.id];}).length;
  document.getElementById('paid-count').textContent = paid;
  document.getElementById('total-count').textContent = total;
  document.getElementById('prog-fill').style.width = (total ? Math.round(paid/total*100) : 0) + '%';
  const done = document.getElementById('all-done');
  if (total > 0 && paid === total) { done.style.display = 'block'; confetti(); } else done.style.display = 'none';
}
function toggle(id) { if (data.paid[id]) delete data.paid[id]; else data.paid[id] = true; save(data); render(); }
function remove(id) { data.cards = data.cards.filter(function(c){return c.id!==id;}); delete data.paid[id]; save(data); render(); }
function addCard(name) { name = name.trim(); if (!name) return; data.cards.push({id:'c'+Date.now(),name:name}); save(data); render(); }

const inp = document.getElementById('add-input'), btn = document.getElementById('add-btn');
btn.addEventListener('click', function() { addCard(inp.value); inp.value=''; inp.dispatchEvent(new Event('input')); inp.focus(); });
inp.addEventListener('keydown', function(e) { if (e.key==='Enter') { addCard(inp.value); inp.value=''; inp.dispatchEvent(new Event('input')); } });

(function() {
  const d = new Date();
  document.getElementById('nav-month').textContent = d.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
})();

var confettiRunning = false;
function confetti() {
  if (confettiRunning) return; confettiRunning = true;
  const c = document.getElementById('confetti-canvas'), ctx = c.getContext('2d');
  c.width = window.innerWidth; c.height = window.innerHeight;
  const cols = ['#0A84FF','#30D158','#5E5CE6','#FF9F0A','#BF5AF2','#5AC8FA','#FFD60A'];
  const bits = Array.from({length:110},function(){return{x:Math.random()*c.width,y:-16,r:3+Math.random()*5,d:2+Math.random()*4,col:cols[Math.floor(Math.random()*cols.length)],t:0,ts:0.08+Math.random()*0.15};});
  var f=0;
  (function draw(){ctx.clearRect(0,0,c.width,c.height);bits.forEach(function(p){ctx.beginPath();ctx.lineWidth=p.r;ctx.strokeStyle=p.col;var tx=Math.sin(p.t)*14;ctx.moveTo(p.x+tx,p.y);ctx.lineTo(p.x+tx+p.r*0.4,p.y+p.r);ctx.stroke();p.t+=p.ts;p.y+=p.d+0.8;});if(++f<200)requestAnimationFrame(draw);else{ctx.clearRect(0,0,c.width,c.height);confettiRunning=false;}})();
}
render();
</script>
</body>
</html>
