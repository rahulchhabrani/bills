<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Bill Tracker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f0f1a; --surface: rgba(255,255,255,0.05);
    --surface-hover: rgba(255,255,255,0.09); --border: rgba(255,255,255,0.10);
    --accent: #6c63ff; --accent2: #a78bfa; --green: #22c55e;
    --green-soft: rgba(34,197,94,0.15); --text: #f1f1f5;
    --muted: #8b8b9e; --danger: #f87171; --card-radius: 18px;
  }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 16px 60px; }
  body::before,body::after { content:''; position:fixed; border-radius:50%; filter:blur(80px); opacity:0.18; pointer-events:none; z-index:0; }
  body::before { width:500px; height:500px; background:radial-gradient(circle,#6c63ff,transparent); top:-100px; left:-100px; animation:blob1 12s ease-in-out infinite alternate; }
  body::after { width:400px; height:400px; background:radial-gradient(circle,#a78bfa,transparent); bottom:-80px; right:-80px; animation:blob2 10s ease-in-out infinite alternate; }
  @keyframes blob1{to{transform:translate(80px,60px) scale(1.1)}} @keyframes blob2{to{transform:translate(-60px,-40px) scale(1.15)}}
  .app { position:relative; z-index:1; width:100%; max-width:480px; }
  .header { text-align:center; margin-bottom:28px; }
  .header .month-badge { display:inline-block; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-size:13px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; padding:5px 16px; border-radius:20px; margin-bottom:12px; }
  .header h1 { font-size:28px; font-weight:700; background:linear-gradient(135deg,#fff 40%,var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .header p { color:var(--muted); font-size:14px; margin-top:6px; }
  .progress-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--card-radius); padding:18px 20px; margin-bottom:20px; backdrop-filter:blur(12px); }
  .progress-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .progress-label { font-size:14px; color:var(--muted); }
  .progress-count { font-size:18px; font-weight:700; }
  .progress-count span { color:var(--green); }
  .bar-bg { height:8px; background:rgba(255,255,255,0.08); border-radius:99px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--green)); transition:width 0.5s cubic-bezier(.4,0,.2,1); width:0%; }
  .all-done-msg { display:none; text-align:center; margin-top:10px; font-size:13px; color:var(--green); font-weight:600; }
  #card-list { display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .cc-card { display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--card-radius); padding:14px 16px; cursor:pointer; user-select:none; transition:background 0.2s,border-color 0.2s,transform 0.15s; backdrop-filter:blur(12px); position:relative; overflow:hidden; }
  .cc-card:hover { background:var(--surface-hover); transform:translateY(-1px); }
  .cc-card.paid { background:var(--green-soft); border-color:rgba(34,197,94,0.3); }
  .cc-card.paid::after { content:''; position:absolute; inset:0; background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,0.04) 50%,transparent 60%); animation:shimmer 2.5s ease infinite; }
  @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .cc-icon { width:42px; height:42px; border-radius:12px; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; transition:background 0.3s; }
  .cc-card.paid .cc-icon { background:linear-gradient(135deg,#16a34a,var(--green)); }
  .cc-name { flex:1; font-size:15px; font-weight:600; transition:color 0.2s; }
  .cc-card.paid .cc-name { color:var(--green); }
  .cc-status { font-size:12px; color:var(--muted); transition:color 0.2s; }
  .cc-card.paid .cc-status { color:var(--green); }
  .cc-toggle { width:26px; height:26px; border-radius:50%; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px; transition:all 0.2s; }
  .cc-card.paid .cc-toggle { background:var(--green); border-color:var(--green); color:#fff; }
  .cc-delete { width:28px; height:28px; border-radius:8px; border:none; background:transparent; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; opacity:0; transition:opacity 0.2s,background 0.2s,color 0.2s; flex-shrink:0; }
  .cc-card:hover .cc-delete { opacity:1; }
  .cc-delete:hover { background:rgba(248,113,113,0.15); color:var(--danger); }
  .add-row { display:flex; gap:10px; margin-bottom:28px; }
  .add-input { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 16px; color:var(--text); font-size:14px; outline:none; transition:border-color 0.2s; backdrop-filter:blur(12px); }
  .add-input::placeholder { color:var(--muted); }
  .add-input:focus { border-color:var(--accent); }
  .add-btn { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:none; border-radius:14px; padding:12px 18px; font-size:20px; cursor:pointer; transition:transform 0.15s; display:flex; align-items:center; justify-content:center; }
  .add-btn:hover { transform:scale(1.06); }
  .reset-note { text-align:center; font-size:12px; color:var(--muted); padding:14px; background:var(--surface); border:1px solid var(--border); border-radius:14px; }
  .reset-note strong { color:var(--accent2); }
  #confetti-canvas { position:fixed; inset:0; pointer-events:none; z-index:999; }
  .empty { text-align:center; padding:32px 0; color:var(--muted); font-size:14px; }
  .empty .emoji { font-size:36px; display:block; margin-bottom:8px; }
  .cc-card { animation:slideIn 0.3s ease; }
  @keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div class="app">
  <div class="header">
    <div class="month-badge" id="month-badge">June 2026</div>
    <h1>&#x1F4B3; Bill Tracker</h1>
    <p>Tap a card to mark it paid</p>
  </div>
  <div class="progress-wrap">
    <div class="progress-top">
      <span class="progress-label">Monthly progress</span>
      <span class="progress-count"><span id="paid-count">0</span> / <span id="total-count">0</span> paid</span>
    </div>
    <div class="bar-bg"><div class="bar-fill" id="bar-fill"></div></div>
    <div class="all-done-msg" id="all-done">All bills paid this month!</div>
  </div>
  <div id="card-list"></div>
  <div class="add-row">
    <input class="add-input" id="add-input" type="text" placeholder="Add a card (e.g. HDFC Regalia)" maxlength="40">
    <button class="add-btn" id="add-btn">+</button>
  </div>
  <div class="reset-note">Paid status <strong>resets automatically</strong> on the 1st of every month.</div>
</div>
<script>
const STORAGE_KEY='cc_tracker_v2';
const ICONS=['&#x1F4B3;','&#x1F3E6;','&#x1FA99;','&#x1F4B0;','&#x1F3E7;','&#x26A1;','&#x1F3AF;','&#x1F48E;','&#x1F31F;','&#x1F535;'];
function getMonthKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1);}
function loadData(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return{cards:[],payments:{},savedMonth:getMonthKey()};const data=JSON.parse(raw);if(data.savedMonth!==getMonthKey()){data.payments={};data.savedMonth=getMonthKey();saveData(data);}return data;}catch(e){return{cards:[],payments:{},savedMonth:getMonthKey()};}}
function saveData(data){localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}
let data=loadData();
function setMonthBadge(){const d=new Date();document.getElementById('month-badge').textContent=d.toLocaleDateString('en-IN',{month:'long',year:'numeric'});}
function render(){const list=document.getElementById('card-list');list.innerHTML='';if(data.cards.length===0){list.innerHTML='<div class="empty"><span class="emoji">&#x1F0CF;</span>No cards yet, add one below!</div>';}else{data.cards.forEach((card,idx)=>{const isPaid=!!data.payments[card.id];const el=document.createElement('div');el.className='cc-card'+(isPaid?' paid':'');el.innerHTML='<div class="cc-icon">'+ICONS[idx%ICONS.length]+'</div><div class="cc-name">'+escapeHtml(card.name)+'</div><div class="cc-status">'+(isPaid?'Paid':'Pending')+'</div><div class="cc-toggle">'+(isPaid?'&#x2713;':'')+'</div><button class="cc-delete" data-id="'+card.id+'">&#x2715;</button>';el.addEventListener('click',(e)=>{if(e.target.closest('.cc-delete'))return;togglePaid(card.id);});el.querySelector('.cc-delete').addEventListener('click',(e)=>{e.stopPropagation();removeCard(card.id);});list.appendChild(el);});}updateProgress();}
function updateProgress(){const total=data.cards.length;const paid=data.cards.filter(c=>data.payments[c.id]).length;document.getElementById('paid-count').textContent=paid;document.getElementById('total-count').textContent=total;document.getElementById('bar-fill').style.width=(total===0?0:Math.round(paid/total*100))+'%';const ad=document.getElementById('all-done');if(total>0&&paid===total){ad.style.display='block';triggerConfetti();}else{ad.style.display='none';}}
function togglePaid(id){if(data.payments[id]){delete data.payments[id];}else{data.payments[id]=true;}saveData(data);render();}
function removeCard(id){data.cards=data.cards.filter(c=>c.id!==id);delete data.payments[id];saveData(data);render();}
function addCard(name){name=name.trim();if(!name)return;data.cards.push({id:'card_'+Date.now(),name});saveData(data);render();}
document.getElementById('add-btn').addEventListener('click',()=>{const i=document.getElementById('add-input');addCard(i.value);i.value='';i.focus();});
document.getElementById('add-input').addEventListener('keydown',(e)=>{if(e.key==='Enter'){const i=document.getElementById('add-input');addCard(i.value);i.value='';}});
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
let confettiRunning=false;
function triggerConfetti(){if(confettiRunning)return;confettiRunning=true;const canvas=document.getElementById('confetti-canvas');const ctx=canvas.getContext('2d');canvas.width=window.innerWidth;canvas.height=window.innerHeight;const pieces=Array.from({length:120},()=>({x:Math.random()*canvas.width,y:-20,r:4+Math.random()*6,d:2+Math.random()*4,color:['#6c63ff','#a78bfa','#22c55e','#facc15','#f472b6','#38bdf8'][Math.floor(Math.random()*6)],tilt:Math.random()*10-5,tiltAngle:0,tiltSpeed:0.1+Math.random()*0.2}));let frame=0;function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);pieces.forEach(p=>{ctx.beginPath();ctx.lineWidth=p.r;ctx.strokeStyle=p.color;ctx.moveTo(p.x+p.tilt+p.r/3,p.y);ctx.lineTo(p.x+p.tilt,p.y+p.tilt+p.r*0.8);ctx.stroke();p.tiltAngle+=p.tiltSpeed;p.y+=p.d+1;p.tilt=Math.sin(p.tiltAngle)*15;});frame++;if(frame<180){requestAnimationFrame(draw);}else{ctx.clearRect(0,0,canvas.width,canvas.height);confettiRunning=false;}}draw();}
setMonthBadge();render();
</script>
</body>
</html>
